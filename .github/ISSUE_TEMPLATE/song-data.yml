name: Add song data
description: Chords (and optionally melody with jyutping) for a song
labels: [data]
body:
  - type: input
    id: song
    attributes:
      label: Song, artist, year
    validations:
      required: true
  - type: input
    id: key
    attributes:
      label: Key
  - type: textarea
    id: chords
    attributes:
      label: Chords by section
      description: Symbols or Roman numerals. No full lyric text.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: How you got them
      description: By ear, from a published score, etc.
    validations:
      required: true
